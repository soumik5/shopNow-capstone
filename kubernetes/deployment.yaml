apiVersion: apps/v1
kind: Deployment

metadata:
  name: shopnow-backend-deployment
  namespace: shopnow

spec:
  replicas: 2

  selector:
    matchLabels:
      app: shopnow-backend

  template:
    metadata:
      labels:
        app: shopnow-backend

    spec:
      containers:
        - name: shopnow-backend

          image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/shopnow-backend:latest

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: shopnow-frontend-deployment
  namespace: shopnow

spec:
  replicas: 2

  selector:
    matchLabels:
      app: shopnow-frontend

  template:
    metadata:
      labels:
        app: shopnow-frontend

    spec:
      containers:
        - name: shopnow-frontend

          image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/shopnow-frontend:latest

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi