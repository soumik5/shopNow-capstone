apiVersion: v1
kind: Service

metadata:
  name: shopnow-backend-service
  namespace: shopnow

spec:
  type: ClusterIP

  selector:
    app: shopnow-backend

  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP

---
apiVersion: v1
kind: Service

metadata:
  name: shopnow-frontend-service
  namespace: shopnow

spec:
  type: LoadBalancer

  selector:
    app: shopnow-frontend

  ports:
    - port: 80
      targetPort: 80
      protocol: TCP