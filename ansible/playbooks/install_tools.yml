
- name: Install Kubernetes deployment tools
  hosts: localhost
  connection: local
  become: yes

  tasks:

    - name: Update apt packages
      apt:
        update_cache: yes

    - name: Install curl and unzip
      apt:
        name:
          - curl
          - unzip
        state: present

    - name: Download AWS CLI
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: '0644'

    - name: Extract AWS CLI
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: yes

    - name: Install AWS CLI
      command: /tmp/aws/install --update

    - name: Download kubectl
      get_url:
        url: https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Verify AWS CLI
      command: aws --version
      changed_when: false

    - name: Verify kubectl
      command: kubectl version --client
      changed_when: false


